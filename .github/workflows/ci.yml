name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same ref (e.g. successive pushes to a PR)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format · Typecheck · Lint · Test · Build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    # `engines` says node >=22, so the suite has to hold on every major that
    # satisfies it. Pinning 22 alone is what let #258 sit unnoticed: two
    # assertions were bounded by a literal that happened to equal Node 22's
    # `Buffer.poolSize`, and went red on 24 without CI ever saying so.
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Style gate: `npm run format` fixes anything this flags.
      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      # `lint` carries --max-warnings 0, so a warning fails the build like an
      # error: fix it, or add an explicit inline disable with a reason.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Cross-platform guard for the embedded terminal (#110): spawn the real `claude`
  # CLI through node-pty on each OS and assert it launches. `claude --version`
  # needs no auth, so no API key/secret is required.
  terminal-integration:
    name: Terminal spawn · ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          # windows-2022: node-gyp finds the VS 2022 toolchain to rebuild node-pty
          # (windows-latest/2025 can't — see release.yml).
          - os: windows-2022
            platform: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build node-pty against this runner's Node ABI (Vitest runs under Node, not
      # Electron). Build tools are present on all three runner images.
      - name: Rebuild node-pty
        run: npm rebuild node-pty

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # claude-cli covers the cross-spawn launcher (#60): on Windows it proves
      # the `claude.cmd` shim resolves without a shell.
      - name: Run CLI spawn tests
        run: npm test -- terminal-spawn.integration claude-cli
        env:
          CLAUDE_E2E: '1'

  # The step that used to run only on a tag — and so could only fail there.
  #
  # `npm run build` is tsc + Vite; it says nothing about whether the app can be
  # PACKAGED. Electron 44 landed with electron-builder's bundled node-abi still
  # unaware of its ABI, every platform job of release.yml died on `Could not
  # detect abi for version 44.3.0`, and the Release was published with no
  # binaries at all — because nothing between the dependency PR and the tag ever
  # invoked electron-builder.
  #
  # `--dir` stops after the app directory: it resolves the ABI, packs the asar
  # and runs the entry-point sanity check — the three things that broke — without
  # spending the minutes an installer costs. Linux only; the failure mode is in
  # the packager, not in any one platform's target.
  package-smoke:
    name: Package smoke (electron-builder --dir)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Pack (no installer)
        run: npx electron-builder --dir --linux
