name: Release

# Publishes a GitHub Release with cross-platform binaries when a v* tag is pushed.
# Build the three platforms on their native runners, then attach every binary
# to the Release in a single publish job (auto-generated changelog from commits).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            pattern: release/*.dmg
          - os: ubuntu-latest
            platform: linux
            pattern: release/*.AppImage
          # Pinned to windows-2022: the windows-latest image rolled to
          # windows-2025, where node-gyp can't locate the VS toolchain and the
          # native node-pty rebuild fails ("Could not find any Visual Studio
          # installation"). windows-2022 ships the VS 2022 Build Tools node-gyp
          # detects.
          - os: windows-2022
            platform: win
            pattern: release/*.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      - name: Package ${{ matrix.platform }} (x64 + arm64)
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: id-token signs the attestation, attestations stores it.
      id-token: write
      attestations: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # The builds are unsigned, so a checksum is the only way for someone to
      # tell the download matches what CI produced. Shipped as a release asset.
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          find . -type f ! -name checksums.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      # Signed, verifiable statement that these exact binaries came out of this
      # workflow run: `gh attestation verify <file> --repo giulio333/ClaudeLens`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
