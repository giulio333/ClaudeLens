name: Release

# Publishes a GitHub Release with cross-platform binaries when a v* tag is pushed.
# Build the three platforms on their native runners, then attach every binary
# to the Release in a single publish job (auto-generated changelog from commits).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            pattern: release/*.dmg
          - os: ubuntu-latest
            platform: linux
            pattern: release/*.AppImage
          # Pinned to windows-2022: the windows-latest image rolled to
          # windows-2025, where node-gyp can't locate the VS toolchain and the
          # native node-pty rebuild fails ("Could not find any Visual Studio
          # installation"). windows-2022 ships the VS 2022 Build Tools node-gyp
          # detects.
          - os: windows-2022
            platform: win
            pattern: release/*.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer + electron
        run: npm run build

      # macOS is packaged on its own path because it is the only platform with a
      # signing story. It is deliberately conditional: with the Apple secrets
      # configured the DMG is signed with the Developer ID certificate and
      # notarized, and without them the job produces exactly the unsigned build
      # it produced before — so forks, and this repo before the certificate
      # exists, keep releasing. Setup: docs/macos-signing.md.
      - name: Package mac (x64 + arm64)
        id: package-mac
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            npx electron-builder --mac --publish never -c.mac.notarize=true
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned macOS build::No Apple signing secrets configured; users will need the quarantine workaround. See docs/macos-signing.md."
            # A missing secret still defines its env var, as the empty string.
            # electron-builder reads CSC_LINK with `chooseNotNull`, which only
            # rejects null — so "" counts as "a certificate was provided", and it
            # resolves the empty path against the project dir and dies with
            # "<workspace> not a file" before packaging anything. Unset them so
            # the unsigned path is the one it actually takes.
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
            # Without this electron-builder would pick up any stray identity in
            # the runner keychain and sign with something we did not choose.
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac --publish never
          fi

      # A DMG that builds is not the same as a DMG Gatekeeper accepts, and the
      # difference only surfaces on a user's Mac after the release is out. Assert
      # it here: valid signature, accepted by policy, and a stapled notarization
      # ticket (the last one is what makes a first launch work offline).
      - name: Verify signature and notarization
        if: steps.package-mac.outputs.signed == 'true'
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(release/mac*/ClaudeLens.app)
          # Without nullglob + this check a renamed output dir would surface as a
          # confusing "codesign: no such file", indistinguishable from a real
          # signing failure.
          if [ ${#apps[@]} -eq 0 ]; then
            echo "No packaged .app found under release/ — did electron-builder's output layout change?" >&2
            exit 1
          fi
          for app in "${apps[@]}"; do
            echo "── $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          done

      - name: Package ${{ matrix.platform }} (x64 + arm64)
        if: matrix.platform != 'mac'
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance: id-token signs the attestation, attestations stores it.
      id-token: write
      attestations: write
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Checksums cover every platform, including the ones with no signing story
      # at all (Linux, Windows), and stay useful for macOS as a cheap integrity
      # check that needs no Apple tooling to verify. Shipped as a release asset.
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: |
          find . -type f ! -name checksums.txt -printf '%P\0' | sort -z | xargs -0 sha256sum > checksums.txt
          cat checksums.txt

      # Signed, verifiable statement that these exact binaries came out of this
      # workflow run: `gh attestation verify <file> --repo giulio333/ClaudeLens`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          generate_release_notes: true
          fail_on_unmatched_files: true
