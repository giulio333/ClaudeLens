version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # All minor/patch updates in one PR — safe to merge after CI.
      npm-minor-patch:
        update-types:
          - minor
          - patch
      # Major version bumps in a separate grouped PR for manual review.
      npm-major:
        update-types:
          - major
        exclude-patterns:
          # Tailwind CSS 4 requires a manual migration — keep it out of automation.
          - 'tailwindcss'
          # TypeScript 7 is ahead of the lint toolchain: typescript-eslint 8.x
          # pins peer `typescript@>=4.8.4 <6.1.0`, so a TS 7 bump makes
          # `npm ci` fail with ERESOLVE and takes the whole major group down
          # with it. Let it back in once typescript-eslint supports TS 7.
          - 'typescript'
    ignore:
      - dependency-name: 'tailwindcss'
        update-types:
          - version-update:semver-major
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types:
          - minor
          - patch
          - major
    labels:
      - dependencies
