version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # All minor/patch updates in one PR — safe to merge after CI.
      npm-minor-patch:
        update-types:
          - minor
          - patch
      # Major version bumps in a separate grouped PR for manual review.
      npm-major:
        update-types:
          - major
        exclude-patterns:
          # Tailwind CSS 4 requires a manual migration — keep it out of automation.
          - 'tailwindcss'
    ignore:
      - dependency-name: 'tailwindcss'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        update-types:
          - minor
          - patch
          - major
    labels:
      - dependencies
